name: Build archive_nintendo

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      # Находит проект где бы он ни лежал: распаковывает любой .zip из репозитория,
      # понимает вложенную папку и «плоскую» загрузку без папки source
      - name: Найти и подготовить проект
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          find_mk() { find . -maxdepth 4 -name Makefile -not -path './.git/*' -not -path '*/build/*' | head -1; }
          mk=$(find_mk)
          if [ -z "$mk" ]; then
            if [ -n "$(find . -maxdepth 3 -name '*.zip' -not -path './.git/*' | head -1)" ]; then
              command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq unzip)
              find . -maxdepth 3 -name '*.zip' -not -path './.git/*' | while read -r z; do
                echo "Распаковываю $z"
                unzip -o -q "$z" -d "$(dirname "$z")"
              done
            fi
            mk=$(find_mk)
          fi
          if [ -z "$mk" ]; then
            echo "::error::Makefile не найден. Загрузите в репозиторий архив archive_nintendo.zip целиком (любое имя .zip) или распакованные файлы с папками."
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          dir=$(cd "$(dirname "$mk")" && pwd)
          # Если файлы загрузили «плоско» (без папки source) — раскладываем сами
          if [ ! -d "$dir/source" ] && ls "$dir"/*.cpp >/dev/null 2>&1; then
            echo "Папки source нет, раскладываю файлы"
            mkdir -p "$dir/source"
            mv "$dir"/*.cpp "$dir"/*.hpp "$dir"/*.h "$dir/source/" 2>/dev/null || true
          fi
          if [ ! -d "$dir/source" ] || [ ! -f "$dir/icon.jpg" ]; then
            echo "::error::В $dir нет папки source или icon.jpg — архив загружен не полностью."
            ls -la "$dir"
            exit 1
          fi
          echo "Проект найден: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      # zlib нужен для распаковки .zip. Сначала смотрим, нет ли его уже в образе; потом пробуем репозиторий devkitPro
      # (он иногда отвечает 403 — тогда повторяем); если не вышло — собираем zlib из исходников с github.com.
      - name: Установить zlib для Switch
        shell: bash
        run: |
          DKP="${DEVKITPRO:-/opt/devkitpro}"
          PL="$DKP/portlibs/switch"
          have_zlib() { [ -f "$PL/lib/libz.a" ] && [ -f "$PL/include/zlib.h" ]; }
          if have_zlib; then echo "zlib уже есть в образе"; exit 0; fi
          for i in 1 2 3; do
            dkp-pacman -Sy --noconfirm switch-zlib && break
            echo "Не удалось взять switch-zlib из репозитория devkitPro (попытка $i из 3)"
            sleep $((i * 10))
          done
          if have_zlib; then echo "zlib установлен из репозитория"; exit 0; fi
          echo "Репозиторий devkitPro недоступен — собираю zlib из исходников"
          export PATH="$DKP/devkitA64/bin:$PATH"
          W="$(mktemp -d)"; cd "$W"
          URL1="https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          URL2="https://zlib.net/zlib-1.3.1.tar.gz"
          if command -v curl >/dev/null; then
            curl -fsSL -o z.tgz "$URL1" || curl -fsSL -o z.tgz "$URL2"
          elif command -v wget >/dev/null; then
            wget -q -O z.tgz "$URL1" || wget -q -O z.tgz "$URL2"
          else
            apt-get update -qq && apt-get install -y -qq curl ca-certificates && curl -fsSL -o z.tgz "$URL1"
          fi
          tar xzf z.tgz
          cd zlib-1.3.1
          CF="-O2 -ffunction-sections -fdata-sections -fPIE -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -D__SWITCH__"
          for f in adler32 crc32 deflate inflate inffast inftrees trees zutil compress uncompr infback; do
            aarch64-none-elf-gcc $CF -c $f.c -o $f.o
          done
          aarch64-none-elf-gcc-ar rcs libz.a *.o
          mkdir -p "$PL/lib" "$PL/include"
          cp libz.a "$PL/lib/"
          cp zlib.h zconf.h "$PL/include/"
          have_zlib && echo "zlib собран и установлен" || { echo "::error::Не удалось получить zlib"; exit 1; }

      - name: Собрать .nro
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          make -j2

      - name: Собрать папку для SD-карты
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/switch/archive_nintendo" "$GITHUB_WORKSPACE/out/archive_nintendo/torrents"
          cp "$PROJECT_DIR/archive_nintendo.nro" "$GITHUB_WORKSPACE/out/switch/archive_nintendo/"
          echo "Кладите сюда файлы .torrent" > "$GITHUB_WORKSPACE/out/archive_nintendo/torrents/README.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: archive_nintendo
          path: out/
          if-no-files-found: error
